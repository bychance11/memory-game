<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>오늘의 기억력 게임</title>
<style>
  :root{
    --bg:#0f1117; --card:#1a1d27; --card2:#232736; --accent:#7c5cff;
    --accent2:#ffb84d; --text:#eef0f6; --sub:#9aa0b4; --ok:#3ddc84; --no:#ff5c7a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Apple SD Gothic Neo','Pretendard','Noto Sans KR',sans-serif;
    background:var(--bg); color:var(--text);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:20px 16px 24px;
  }
  header{text-align:center; margin-bottom:14px;}
  header h1{font-size:24px; letter-spacing:-0.5px;}
  header h1 span{color:var(--accent2);}
  header .date{color:var(--sub); font-size:13px; margin-top:5px;}
  .streak{
    display:inline-block; margin-top:8px; font-size:13px; font-weight:700;
    background:var(--card); border:1px solid #2a2e3f; border-radius:20px; padding:6px 14px;
    color:var(--accent2);
  }
  .diff-row{display:flex; gap:6px; justify-content:center; margin-top:10px;}
  .diff-row button{
    border:1px solid #2a2e3f; background:var(--card); color:var(--sub);
    border-radius:20px; padding:6px 14px; font-size:13px; font-weight:700;
    cursor:pointer; font-family:inherit; transition:.15s;
  }
  .diff-row button.active{color:#fff;}
  .diff-row button.active[data-diff="easy"]{background:#31b57c; border-color:#31b57c;}
  .diff-row button.active[data-diff="normal"]{background:var(--accent); border-color:var(--accent);}
  .diff-row button.active[data-diff="hard"]{background:#e15564; border-color:#e15564;}

  .progress{display:flex; gap:6px; margin:12px 0 18px;}
  .progress .dot{width:26px; height:6px; border-radius:3px; background:var(--card2); transition:.3s;}
  .progress .dot.done{background:var(--ok);}
  .progress .dot.fail{background:var(--no);}
  .progress .dot.now{background:var(--accent);}

  .card{
    width:100%; max-width:520px; background:var(--card);
    border:1px solid #2a2e3f; border-radius:16px;
    padding:24px; box-shadow:0 12px 40px rgba(0,0,0,.4);
  }
  .badge{
    display:inline-block; font-size:12px; font-weight:700; letter-spacing:1px;
    padding:5px 12px; border-radius:20px; background:var(--accent); color:#fff; margin-bottom:16px;
  }
  .badge.movie{background:#e15564;} .badge.variety{background:#3aa0ff;}
  .badge.actor{background:#e69a2e;} .badge.singer{background:#31b57c;}
  .badge.capital{background:#8f5cff;}

  .question-area{
    background:var(--card2); border-radius:12px; min-height:160px;
    display:flex; align-items:center; justify-content:center;
    padding:20px; margin-bottom:18px; text-align:center;
  }
  .question-area img{max-width:100%; max-height:280px; border-radius:8px;}
  .question-area .prompt{font-size:19px; line-height:1.6; word-break:keep-all;}
  .question-area .lyric{font-style:italic; color:var(--accent2); font-size:19px;}
  .cast-chips{display:flex; gap:8px; flex-wrap:wrap; justify-content:center;}
  .cast-chips .chip{
    background:var(--bg); border:1px solid #333849; border-radius:20px;
    padding:8px 16px; font-size:16px; font-weight:700;
  }

  .hint-row{display:flex; align-items:center; gap:10px; margin-bottom:18px; flex-wrap:wrap; justify-content:center;}
  .hint-slots{display:flex; gap:6px; flex-wrap:wrap; justify-content:center;}
  .slot{
    width:38px; height:46px; border-radius:8px; background:var(--card2);
    border:1px solid #333849; display:flex; align-items:center; justify-content:center;
    font-size:22px; font-weight:700; color:var(--accent2);
  }
  .slot.space{background:transparent; border:none; width:14px;}
  .slot.empty{color:#4a4f63;}

  .btn{
    border:none; border-radius:10px; padding:12px 18px; font-size:15px; font-weight:700;
    cursor:pointer; transition:.15s; font-family:inherit;
  }
  .btn:active{transform:scale(.97);}
  .btn-hint{background:var(--accent); color:#fff; width:100%;}
  .btn-hint:disabled{background:#3a3e52; color:#777e97; cursor:default;}
  .btn-next{background:var(--accent2); color:#1a1400; width:100%; margin-top:12px;}
  .btn-giveup{background:transparent; color:var(--sub); border:1px solid #333849; width:100%; margin-top:8px;}
  .btn-share{background:#3aa0ff; color:#fff; width:100%; margin-top:8px;}

  .answer-row{display:flex; gap:8px; margin-bottom:12px;}
  .answer-row input{
    flex:1; padding:13px 14px; border-radius:10px; border:1px solid #333849;
    background:var(--card2); color:var(--text); font-size:16px; font-family:inherit; outline:none; min-width:0;
  }
  .answer-row input:focus{border-color:var(--accent);}
  .answer-row .btn{background:#3a3e52; color:#fff;}

  .result{
    text-align:center; padding:14px; border-radius:10px; margin-bottom:4px;
    font-size:16px; font-weight:700; display:none;
  }
  .result.ok{display:block; background:rgba(61,220,132,.12); color:var(--ok);}
  .result.no{display:block; background:rgba(255,92,122,.12); color:var(--no);}
  .result.reveal{display:block; background:rgba(255,184,77,.12); color:var(--accent2);}
  .result small{display:block; font-weight:400; color:var(--sub); margin-top:4px; font-size:13px;}
  .answer-info{
    margin-top:10px; padding:10px 14px; border-radius:8px;
    background:rgba(0,0,0,.25); text-align:left;
    font-size:13px; font-weight:400; color:var(--sub); line-height:1.7;
  }
  .answer-info div::before{content:"· "; color:var(--accent2);}

  .final{text-align:center; padding:26px 8px;}
  .final .score{font-size:50px; font-weight:800; color:var(--accent2); margin:12px 0;}
  .final p{color:var(--sub); line-height:1.7;}
  .final .emoji-line{font-size:22px; letter-spacing:3px; margin:10px 0;}
  .shake{animation:shake .35s;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

  /* 모바일 기본: 본문 흐름 안에 배치 (고정 X → 키보드·문제 화면을 가리지 않음) */
  nav{
    width:100%; max-width:520px; margin-top:16px;
    background:var(--card); border:1px solid #2a2e3f; border-radius:14px;
    display:flex; justify-content:center; gap:2px; padding:8px 6px;
  }
  nav button{
    flex:1; max-width:90px; background:none; border:none; cursor:pointer;
    color:var(--sub); font-family:inherit; font-size:11px; font-weight:700;
    display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px;
    border-radius:10px; transition:.15s;
  }
  nav button .ico{font-size:20px;}
  nav button.active{color:var(--accent2); background:rgba(255,184,77,.08);}
  footer{margin-top:20px; color:#565c72; font-size:12px; text-align:center; line-height:1.6;}
  /* ── 모바일 압축 레이아웃: 키보드가 화면 절반을 차지하는 것을 고려 ── */
  @media (max-width: 600px){
    body{padding:12px 12px 16px;}
    header h1{font-size:19px;}
    header .date{font-size:11px; margin-top:2px;}
    .streak{margin-top:5px; font-size:11px; padding:4px 10px;}
    .diff-row{margin-top:7px;}
    .diff-row button{padding:5px 11px; font-size:12px;}
    .progress{margin:8px 0 10px;}
    .card{padding:14px;}
    .badge{margin-bottom:10px;}
    .question-area{min-height:100px; padding:12px; margin-bottom:12px;}
    .question-area img{max-height:170px;}
    .question-area .prompt{font-size:15px;}
    .cast-chips .chip{padding:6px 12px; font-size:14px;}
    .slot{width:30px; height:38px; font-size:17px; border-radius:6px;}
    .slot.space{width:10px;}
    .hint-row{margin-bottom:12px;}
    .btn{padding:10px 14px; font-size:14px;}
    .answer-row input{padding:11px 12px;}
    /* 키보드 열림(입력 포커스) 시: 문제·초성·입력창만 남기고 숨김 */
    body.kb header, body.kb .progress, body.kb nav, body.kb footer{display:none;}
    body.kb .question-area{min-height:0;}
    body.kb .question-area img{max-height:130px;}
    body.kb .btn-giveup{display:none;}
  }
  /* 넓은 화면(데스크톱)에서만 하단 고정 */
  @media (min-width: 768px){
    body{padding-bottom:96px;}
    nav{
      position:fixed; bottom:0; left:0; right:0;
      max-width:none; margin-top:0; border-radius:0; border:none;
      background:rgba(20,22,32,.95); backdrop-filter:blur(12px);
      border-top:1px solid #2a2e3f; padding:8px 6px 14px;
    }
  }
</style>
</head>
<body>

<header>
  <h1 id="pageTitle">🧠 오늘의 <span>기억력 게임</span></h1>
  <div class="date" id="dateLabel"></div>
  <div class="streak" id="streakLabel" style="display:none"></div>
  <div class="diff-row" id="diffRow">
    <button data-diff="easy">😊 쉬움</button>
    <button data-diff="normal">🙂 보통</button>
    <button data-diff="hard">🔥 어려움</button>
  </div>
</header>

<div class="progress" id="progress"></div>
<div class="card" id="card"></div>

<nav id="nav">
  <button data-page="home"><span class="ico">🧠</span>오늘의 게임</button>
  <button data-page="movie"><span class="ico">🎬</span>영화</button>
  <button data-page="singer"><span class="ico">🎤</span>가수</button>
  <button data-page="actor"><span class="ico">🎭</span>배우</button>
  <button data-page="capital"><span class="ico">🌍</span>수도</button>
  <button data-page="variety"><span class="ico">📺</span>예능</button>
</nav>

<footer>
  힌트를 적게 쓸수록 높은 점수! · 매일 자정에 새 문제 출제<br>
  questions.json이 있으면 자동으로 불러옵니다
</footer>

    {answer:"아스타나", difficulty:"hard", prompt:"🌍 카자흐스탄의 수도는?", alt:[]},

    {answer:"뿅뿅 지구오락실", difficulty:"hard", cast:["이은지","미미","이영지","안유진"], alt:["지구오락실"]},
    {answer:"출장 십오야", difficulty:"hard", cast:["나영석","김대주","이우정"], alt:["출장십오야","십오야"]},
    {answer:"강식당", difficulty:"hard", cast:["강호동","이수근","은지원","송민호"], alt:[]},
    {answer:"어쩌다 사장", difficulty:"hard", cast:["차태현","조인성","김우빈"], alt:["어쩌다사장"]}

};

const CATEGORY_META = {
  movie:{label:"영화", ico:"🎬", title:"오늘의 영화게임", ask:"이 영화의 제목은?"},
  singer:{label:"가수", ico:"🎤", title:"오늘의 가수게임", ask:"이 노래를 부른 가수는?"},
  actor:{label:"배우", ico:"🎭", title:"오늘의 배우게임", ask:"이 배우의 이름은?"},
  capital:{label:"수도", ico:"🌍", title:"오늘의 수도게임", ask:"이 나라의 수도는?"},
  variety:{label:"예능", ico:"📺", title:"오늘의 예능게임", ask:"이 출연진의 예능 프로그램은?"}
};
const PAGES = ["home","movie","singer","actor","capital","variety"];
const PER_THEME = 5; // 테마 페이지당 문제 수

/* ================= 초성 유틸 ================= */
const CHO = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
function chosungOf(ch){
  const code = ch.charCodeAt(0);
  if(code >= 0xAC00 && code <= 0xD7A3) return CHO[Math.floor((code-0xAC00)/588)];
  return ch;
}
function normalize(s){ return s.replace(/[\s.\-!?~'"]/g,"").toLowerCase(); }

/* ================= 날짜 시드 ================= */
function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function todaySeed(extra=0){
  const d = new Date();
  return d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate() + extra;
}
function seededShuffle(arr, rng){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

/* ================= 출석(streak) : localStorage 기반 =================
   ※ IP 기반 공유는 서버가 필요합니다. 정적 HTML에서는 브라우저별
   localStorage로 기록합니다. (README 참고) */
const STORE_KEY = "memgame_v1";
function loadStore(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; }
}
function saveStore(s){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }catch(e){} }
function recordAttendance(){
  const s = loadStore();
  const today = todayStr();
  if(s.lastDone === today) return s; // 오늘 이미 출석
  const y = new Date(); y.setDate(y.getDate()-1);
  const yesterday = `${y.getFullYear()}-${String(y.getMonth()+1).padStart(2,"0")}-${String(y.getDate()).padStart(2,"0")}`;
  s.streak = (s.lastDone === yesterday) ? (s.streak||0)+1 : 1;
  s.best = Math.max(s.best||0, s.streak);
  s.lastDone = today;
  saveStore(s);
  return s;
}
function renderStreak(){
  const s = loadStore();
  const el = document.getElementById("streakLabel");
  if(s.streak){
    el.style.display = "inline-block";
    el.textContent = `🔥 ${s.streak}일 연속 출석${s.best>s.streak?` (최고 ${s.best}일)`:""}`;
  }
}

/* ================= 게임 세션 ================= */
let DATA = SAMPLE_QUESTIONS;
const sessions = {}; // page -> state
let currentPage = "home";
const $ = id => document.getElementById(id);
const isTouch = matchMedia("(pointer: coarse)").matches;
// 모바일에선 자동 포커스 금지 (키보드가 멋대로 화면을 덮는 것 방지)
function focusInput(){ if(!isTouch) $("answerInput").focus(); }

/* ---- 난이도 ---- */
const DIFFS = ["easy","normal","hard"];
function getDiff(){
  const d = loadStore().difficulty;
  return DIFFS.includes(d) ? d : "normal";
}
function setDiff(d){
  const s = loadStore(); s.difficulty = d; saveStore(s);
  Object.keys(sessions).forEach(k=>delete sessions[k]); // 세션 리셋
  renderDiffRow();
  switchPage(currentPage);
}
function renderDiffRow(){
  const d = getDiff();
  document.querySelectorAll("#diffRow button").forEach(b=>{
    b.classList.toggle("active", b.dataset.diff===d);
  });
}
function poolFor(cat){
  const all = DATA[cat]||[];
  const d = getDiff();
  const filtered = all.filter(q=>!q.difficulty || q.difficulty===d);
  return filtered.length >= 3 ? filtered : all; // 해당 난이도 문제가 부족하면 전체 사용
}

function buildQuestions(page){
  const diffOffset = DIFFS.indexOf(getDiff())*131;
  if(page === "home"){
    const rng = mulberry32(todaySeed(diffOffset));
    const qs = [];
    for(const cat of Object.keys(CATEGORY_META)){
      const pool = seededShuffle(poolFor(cat), rng);
      if(pool[0]) qs.push({...pool[0], category:cat});
    }
    return seededShuffle(qs, rng);
  }
  const rng = mulberry32(todaySeed(PAGES.indexOf(page)*777 + diffOffset));
  return seededShuffle(poolFor(page), rng).slice(0, PER_THEME).map(q=>({...q, category:page}));
}

function getSession(page){
  if(!sessions[page]){
    sessions[page] = {questions:buildQuestions(page), idx:0, hintsUsed:0, solved:false,
                      results:[], hints:[], score:0, finished:false};
  }
  return sessions[page];
}

/* ================= 렌더링 ================= */
function renderProgress(){
  const s = getSession(currentPage);
  $("progress").innerHTML = s.questions.map((_,i)=>{
    let cls="dot";
    if(s.finished || i<s.idx) cls += s.results[i] ? " done" : (s.results[i]===false ? " fail" : "");
    else if(i===s.idx) cls += " now";
    return `<div class="${cls}"></div>`;
  }).join("");
}

function questionHTML(q){
  if(q.img) return `<img src="${q.img}" alt="문제 이미지" onerror="this.outerHTML='<div class=prompt>⚠️ 이미지를 불러올 수 없어요<br>${(q.prompt||'')}</div>'">`;
  if(q.cast) return `<div><div style="color:var(--sub);font-size:14px;margin-bottom:12px">이 출연진의 예능 프로그램은?</div>
    <div class="cast-chips">${q.cast.map(c=>`<span class="chip">${c}</span>`).join("")}</div></div>`;
  return `<div class="prompt ${q.lyric?'lyric':''}">${q.prompt}</div>`;
}

function renderGame(){
  const s = getSession(currentPage);
  if(s.finished){ renderFinal(); return; }
  const q = s.questions[s.idx];
  if(!q){ renderFinal(); return; }
  const meta = CATEGORY_META[q.category];

  $("card").innerHTML = `
    <span class="badge ${q.category}">${meta.label}</span>
    <div class="question-area">${questionHTML(q)}</div>
    <div class="hint-row"><div class="hint-slots" id="slots"></div></div>
    <button class="btn btn-hint" id="hintBtn"></button>
    <div style="height:14px"></div>
    <div class="answer-row">
      <input type="text" id="answerInput" placeholder="정답 입력 후 Enter" autocomplete="off">
      <button class="btn" id="submitBtn">확인</button>
    </div>
    <div class="result" id="result"></div>
    <button class="btn btn-giveup" id="giveupBtn">포기하고 정답 보기</button>
    <button class="btn btn-next" id="nextBtn" style="display:none">다음 문제 →</button>`;

  renderSlots(s.solved);
  updateHintBtn();
  if(s.solved) restoreSolvedUI();
  renderProgress();

  $("hintBtn").onclick = useHint;
  $("submitBtn").onclick = checkAnswer;
  $("giveupBtn").onclick = ()=>finish(false);
  $("nextBtn").onclick = next;
  const inp = $("answerInput");
  inp.onkeydown = e=>{ if(e.key==="Enter") checkAnswer(); };
  // 키보드 열림/닫힘에 맞춰 화면 압축 모드 전환
  inp.onfocus = ()=>{ document.body.classList.add("kb"); adjustForKeyboard(); };
  inp.onblur = ()=>document.body.classList.remove("kb");
  focusInput();
}

// 입력창을 키보드 '바로 위'에 붙임 (visualViewport = 키보드 제외한 실제 보이는 영역)
function adjustForKeyboard(){
  setTimeout(()=>{
    const inp = $("answerInput");
    if(!inp || document.activeElement !== inp) return;
    const vv = window.visualViewport;
    const visibleH = vv ? vv.height : innerHeight;
    const r = inp.getBoundingClientRect();
    const delta = r.bottom - (visibleH - 14); // 입력창 아래 여백 14px만 남김
    if(Math.abs(delta) > 4) window.scrollBy({top: delta, behavior:"smooth"});
  }, 300);
}
if(window.visualViewport){
  visualViewport.addEventListener("resize", ()=>{
    if(document.body.classList.contains("kb")) adjustForKeyboard();
  });
}

function hintTargets(){
  const s = getSession(currentPage);
  const ans = s.questions[s.idx].answer;
  const t=[];
  for(let i=0;i<ans.length;i++) if(ans[i]!==" ") t.push(i);
  return t;
}

/* 힌트 단계: 글자 수 N일 때 총 2N번.
   1~N번째 클릭 = 초성이 한 글자씩, N+1~2N번째 = 글자가 한 자씩 공개.
   마지막(2N번째)까지 누르면 정답 공개 처리. */
function renderSlots(revealAll=false){
  const s = getSession(currentPage);
  const ans = s.questions[s.idx].answer;
  const targets = hintTargets();
  const n = targets.length;
  const stage = new Map(); // 글자 인덱스 -> 0:숨김 1:초성 2:글자
  targets.forEach((idx,pos)=>{
    stage.set(idx, s.hintsUsed >= n+pos+1 ? 2 : s.hintsUsed >= pos+1 ? 1 : 0);
  });
  $("slots").innerHTML = [...ans].map((ch,i)=>{
    if(ch===" ") return `<div class="slot space"></div>`;
    if(revealAll || stage.get(i)===2) return `<div class="slot">${ch}</div>`;
    if(stage.get(i)===1) return `<div class="slot">${chosungOf(ch)}</div>`;
    return `<div class="slot empty">?</div>`;
  }).join("");
}

function updateHintBtn(){
  const s = getSession(currentPage);
  const n = hintTargets().length;
  const total = n*2;
  const btn = $("hintBtn");
  const kind = s.hintsUsed < n ? "초성" : "글자";
  btn.textContent = s.hintsUsed >= total
    ? `💡 힌트 소진`
    : `💡 ${kind} 힌트 열기 (${s.hintsUsed}/${total})`;
  btn.disabled = s.solved || s.hintsUsed>=total;
}

function useHint(){
  const s = getSession(currentPage);
  const total = hintTargets().length*2;
  if(s.solved || s.hintsUsed>=total) return;
  s.hintsUsed++;
  renderSlots();
  updateHintBtn();
  if(s.hintsUsed >= total){ finish(false); return; } // 마지막 힌트 = 정답 공개
  focusInput();
}

function checkAnswer(){
  const s = getSession(currentPage);
  if(s.solved) return;
  const q = s.questions[s.idx];
  const input = normalize($("answerInput").value);
  if(!input) return;
  const answers = [q.answer, ...(q.alt||[])].map(normalize);
  if(answers.includes(input)){ finish(true); }
  else{
    const r = $("result");
    r.className="result no";
    r.textContent="❌ 땡! 다시 생각해보세요";
    $("card").classList.remove("shake");
    void $("card").offsetWidth;
    $("card").classList.add("shake");
    $("answerInput").select();
  }
}

function finish(correct){
  const s = getSession(currentPage);
  s.solved = true;
  const q = s.questions[s.idx];
  const total = hintTargets().length*2;
  renderSlots(true);
  const r = $("result");
  const infoHtml = (q.info && q.info.length)
    ? `<div class="answer-info">${q.info.map(l=>`<div>${l}</div>`).join("")}</div>` : "";
  if(correct){
    const pts = Math.max(10, 100 - Math.round(s.hintsUsed/total*90));
    s.score += pts;
    s.results[s.idx] = true;
    s.hints[s.idx] = s.hintsUsed;
    r.className="result ok";
    r.innerHTML = `⭕ 정답! <b>${q.answer}</b> (+${pts}점)<small>힌트 ${s.hintsUsed}개 사용</small>${infoHtml}`;
  }else{
    s.results[s.idx] = false;
    r.className="result reveal";
    r.innerHTML = `정답은 <b>${q.answer}</b> 였습니다${infoHtml}`;
  }
  restoreSolvedUI();
  renderProgress();
}

function restoreSolvedUI(){
  const s = getSession(currentPage);
  $("answerInput").disabled = true;
  $("submitBtn").disabled = true;
  $("hintBtn").disabled = true;
  $("giveupBtn").style.display = "none";
  const nb = $("nextBtn");
  nb.style.display = "block";
  nb.textContent = s.idx < s.questions.length-1 ? "다음 문제 →" : "결과 보기 🏁";
  nb.focus();
}

function next(){
  const s = getSession(currentPage);
  s.idx++;
  s.hintsUsed = 0;
  s.solved = false;
  if(s.idx >= s.questions.length){
    s.finished = true;
    if(currentPage === "home") recordAttendance();
    renderStreak();
    renderFinal();
    return;
  }
  renderGame();
}

function shareText(){
  const s = getSession(currentPage);
  const meta = currentPage==="home" ? {title:"오늘의 기억력 게임"} : CATEGORY_META[currentPage];
  const emojis = s.results.map(r=>r?"🟩":"🟥").join("");
  const st = loadStore();
  return `🧠 ${meta.title} ${todayStr()}\n${emojis} ${s.score}점` +
         (st.streak?` 🔥${st.streak}일 연속`:"");
}

function renderFinal(){
  const s = getSession(currentPage);
  const correct = s.results.filter(Boolean).length;
  const emojis = s.results.map(r=>r?"🟩":"🟥").join("");
  $("card").innerHTML = `
    <div class="final">
      <div style="font-size:40px">${correct===s.questions.length?"🏆":correct>0?"🎉":"😅"}</div>
      <div class="score">${s.score}점</div>
      <div class="emoji-line">${emojis}</div>
      <p>${s.questions.length}문제 중 <b style="color:var(--text)">${correct}문제</b> 정답!<br>
      내일 자정에 새로운 문제가 출제됩니다.</p>
      <div style="height:14px"></div>
      <button class="btn btn-share" id="shareBtn">📋 결과 공유하기</button>
      <button class="btn btn-giveup" id="retryBtn">오늘 문제 다시 풀기</button>
    </div>`;
  renderProgress();
  $("shareBtn").onclick = async ()=>{
    try{
      await navigator.clipboard.writeText(shareText());
      $("shareBtn").textContent = "✅ 복사 완료!";
    }catch(e){ prompt("복사해서 공유하세요:", shareText()); }
  };
  $("retryBtn").onclick = ()=>{ delete sessions[currentPage]; renderGame(); };
}

/* ================= 페이지 전환 ================= */
function switchPage(page){
  if(!PAGES.includes(page)) page = "home";
  currentPage = page;
  location.hash = page==="home" ? "" : page;
  document.querySelectorAll("nav button").forEach(b=>{
    b.classList.toggle("active", b.dataset.page===page);
  });
  const t = $("pageTitle");
  if(page==="home") t.innerHTML = `🧠 오늘의 <span>기억력 게임</span>`;
  else{
    const m = CATEGORY_META[page];
    t.innerHTML = `${m.ico} 오늘의 <span>${m.label}게임</span>`;
  }
  renderGame();
}

/* ================= 초기화 ================= */
async function loadData(){
  try{
    // 날짜를 쿼리로 붙여 브라우저·CDN 캐시 우회 (하루 단위 갱신이므로 날짜면 충분)
    const res = await fetch("questions.json?d=" + todaySeed(), {cache:"no-store"});
    if(res.ok){
      const d = await res.json();
      if(d && (d.movie||d.singer)) return {...SAMPLE_QUESTIONS, ...d};
    }
  }catch(e){
    if(location.protocol === "file:"){
      const f = document.querySelector("footer");
      f.innerHTML = `⚠️ <b style="color:var(--accent2)">지금은 내장 샘플 문제로 실행 중입니다.</b><br>
        크롤링한 문제(영화 스틸컷 등)를 보려면 폴더의 <b>시작하기.command</b>를 더블클릭하거나<br>
        터미널에서 <code>python3 -m http.server 8000</code> 실행 후 localhost:8000 으로 여세요.` + "<br><br>" + f.innerHTML;
    }
  }
  return SAMPLE_QUESTIONS;
}

(async function init(){
  const d = new Date();
  $("dateLabel").textContent = `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일의 문제`;
  renderStreak();
  renderDiffRow();
  DATA = await loadData();
  document.querySelectorAll("nav button").forEach(b=>{
    b.onclick = ()=>switchPage(b.dataset.page);
  });
  document.querySelectorAll("#diffRow button").forEach(b=>{
    b.onclick = ()=>setDiff(b.dataset.diff);
  });
  switchPage(location.hash.replace("#","") || "home");
})();
</script>
