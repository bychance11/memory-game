name: 매일 문제 자동 갱신

on:
  schedule:
    - cron: "0 20 * * *"   # UTC 20:00 = 한국시간 새벽 5시
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

jobs:
  update-questions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 크롤러 실행
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          pip install requests beautifulsoup4
          python crawler/crawl_questions.py --out questions.json

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add questions.json
          git diff --cached --quiet || git commit -m "🤖 매일 문제 자동 갱신 $(date +%F)"
          git pull --rebase origin main   # 실행 중 끼어든 푸시가 있으면 먼저 반영
          git push
